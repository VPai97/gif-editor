<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zigma</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <div class="workspace">
      <aside class="sidebar">
        <div class="brand">Z</div>
        <button class="icon-btn" title="Media">+</button>
        <button class="icon-btn" title="Canvas">C</button>
        <button class="icon-btn" title="Text">T</button>
        <button class="icon-btn" title="Audio">A</button>
        <button class="icon-btn" title="Images">I</button>
        <button class="icon-btn" title="Elements">E</button>
        <button class="icon-btn" title="Record">R</button>
        <button class="icon-btn" title="TTS">S</button>
      </aside>

      <section class="left-panel">
        <div class="panel-header">
          <h1>Zigma</h1>
          <p>GIF editor workspace</p>
        </div>

        <input id="gifInput" class="file-input" type="file" accept="image/gif" />
        <label class="upload-card" for="gifInput">
          <p>Click to upload</p>
          <span>or drag & drop file here</span>
        </label>

        <div class="meta">Original size: <span id="origSize">—</span></div>
        <div class="meta">File size: <span id="origFileSize">—</span></div>

        <div class="settings">
          <h2>Settings</h2>
          <label class="field">
            <span>Target width (px)</span>
            <input id="targetWidth" type="number" min="1" placeholder="e.g. 480" />
          </label>
          <label class="field">
            <span>Target height (px)</span>
            <input id="targetHeight" type="number" min="1" placeholder="e.g. 270" />
          </label>
          <label class="checkbox">
            <input id="keepAspect" type="checkbox" checked />
            <span>Keep aspect ratio if one dimension is blank</span>
          </label>
          <label class="field">
            <span>FPS (frames per second)</span>
            <input id="fps" type="number" min="1" max="60" step="1" placeholder="e.g. 12" />
          </label>
          <label class="checkbox">
            <input id="resampleFps" type="checkbox" checked />
            <span>Resample frames to target FPS (smaller file)</span>
          </label>
          <label class="field">
            <span>Trim start (seconds)</span>
            <input id="trimStart" type="number" min="0" step="0.1" placeholder="e.g. 0.0" />
          </label>
          <label class="field">
            <span>Trim end (seconds)</span>
            <input id="trimEnd" type="number" min="0" step="0.1" placeholder="e.g. 2.5" />
          </label>
          <label class="field">
            <span>Target size (KB)</span>
            <input id="targetSize" type="number" min="1" step="10" placeholder="e.g. 800" />
          </label>
          <label class="checkbox">
            <input id="autoReduce" type="checkbox" checked />
            <span>Auto reduce to target size (may drop frames/colors)</span>
          </label>
          <button id="processBtn" type="button">Process GIF</button>
          <p id="status" class="status"></p>
          <div class="meta">Output size: <span id="outputSize">—</span></div>
          <a id="downloadLink" class="download hidden" download>Download edited GIF</a>
        </div>
      </section>

      <section class="stage">
        <div class="stage-inner">
          <div id="previewWrap" class="preview-wrap">
            <div class="preview-stage">
              <div class="preview-placeholder">GIF preview</div>
              <img id="preview" class="preview-image hidden" alt="GIF preview" />
            </div>
          </div>
          <p class="helper">Preview your GIF before export.</p>
        </div>

        <div class="timeline">
          <div class="timeline-tools">
            <button class="icon-btn" title="Split">|</button>
            <button class="icon-btn" title="Trim">[]</button>
            <button class="icon-btn" title="Delete">X</button>
          </div>
          <div class="timeline-track">
            <div class="timeline-label">00:00 / 00:00</div>
            <div class="timeline-bar">
              <div class="timeline-progress"></div>
            </div>
          </div>
          <div class="timeline-tools">
            <button class="icon-btn" title="Zoom out">-</button>
            <button class="icon-btn" title="Zoom in">+</button>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
